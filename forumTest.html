<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlumniForge Forum Test</title>
</head>

<body>

    <h1>AlumniForge Forum Test</h1>

    <p id="status">Loading...</p>

    <hr>

    <h2>Create Post</h2>

    <form id="post-form">
        <input
            id="post-title"
            type="text"
            placeholder="Post title"
            required
        >

        <br><br>

        <textarea
            id="post-content"
            placeholder="Write your post..."
            required
        ></textarea>

        <br><br>

        <button type="submit">Create Post</button>
    </form>

    <hr>

    <h2>Forum Posts</h2>

    <div id="posts"></div>

    <script type="module" src="/src/forumTest.js"></script>

</body>
</html>
